# Note: profile variables are set/overridden in profile/ files:
# etc/portage/profile/use.force (overrides kernel_* USE variables)
# etc/portage/profile/make.defaults (overrides ARCH, KERNEL, ELIBC variables)

CHOST=aarch64-unknown-linux-gnu
CBUILD=x86_64-pc-linux-musl

ROOT=/usr/${CHOST}/

ACCEPT_KEYWORDS="${ARCH} ~${ARCH}"
#ACCEPT_KEYWORDS="${ARCH}"

USE="${ARCH} -X -python -suid zstd minizip alsa sdl -gtk wayland egl gles2 vulkan vaapi elogind zlib lzma bzip2 aacs cddb -e2fsprogs archive bluray cdda cdio dvd fontconfig jpeg lzma v4l mp3 truetype vorbis vpx webp x264 x265 xvid opus a52 -examples -telemetry dbus openh264 postproc secure-delete gif svg theora libass glslang pipewire"
VIDEO_CARDS="v3d vc4 virgl"

COMMON_FLAGS="-O2 -pipe -march=armv8-a+crc -mtune=cortex-a72 -fomit-frame-pointer"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
#CXXFLAGS="${CFLAGS}"

LLVM_TARGETS="AArch64"

CPU_FLAGS_ARM="edsp neon thumb vfp vfpv3 vfpv4 vfp-d32 crc32 v4 v5 v6 v7 v8 thumb2"

RUSTFLAGS="-C target-feature=-crt-static -C target-cpu=cortex-a72"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS="${RUSTFLAGS}"

FEATURES="protect-owned sandbox buildpkg"
# Be sure we dont overwrite pkgs from another repo..
PKGDIR=${ROOT}packages/
#PORTAGE_TMPDIR=${ROOT}tmp/
PORTAGE_TMPDIR=/var/tmp/portage/rpi4b
DISTDIR=/var/cache/distfiles

PKG_CONFIG_PATH="${ROOT}usr/lib/pkgconfig/"
#PORTDIR_OVERLAY="/var/db/repos/local/"

ACCEPT_LICENSE="*"

EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --jobs"


